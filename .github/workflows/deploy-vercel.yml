# PIPELINE 2 de 3 — Frontend na Vercel.
#
#   PR para main  -> deploy de preview (URL temporária, comentada no PR)
#   push em main  -> deploy de produção
#
# O gate é o job `gate`, que roda a mesma suíte de tests.yml. Os jobs de deploy têm
# `needs: gate`, então um teste vermelho impede o deploy dentro do mesmo run — não há
# corrida nem "confiar" que outro workflow passou.
#
# ---------------------------------------------------------------------------------
# PASSO MANUAL OBRIGATÓRIO, SENÃO O GATE É DECORATIVO
# ---------------------------------------------------------------------------------
# Se a integração Git nativa da Vercel continuar ligada, ela faz o deploy sozinha
# assim que o commit chega no GitHub — em paralelo com este workflow e SEM esperar
# o teste. O código quebrado sobe do mesmo jeito.
#
# Desligue uma das duas formas:
#   a) Vercel > Project > Settings > Git > desativar os deploys automáticos; ou
#   b) adicionar em frontend/vercel.json:  "github": { "enabled": false }
#
# Não fiz (b) por você: se os secrets abaixo ainda não estiverem cadastrados, isso
# derruba o único caminho de deploy que existe hoje. Cadastre os secrets, confirme um
# deploy verde por aqui, e só então desligue a integração nativa.
#
# ---------------------------------------------------------------------------------
# SECRETS (Settings > Secrets and variables > Actions > Repository secrets)
# Cadastre os VALORES no GitHub. Nenhum deles deve aparecer neste arquivo.
# ---------------------------------------------------------------------------------
#   VERCEL_TOKEN       Vercel > Account Settings > Tokens. Dê o menor escopo possível
#                      (apenas o projeto do NutriAgent, não a conta inteira).
#   VERCEL_ORG_ID      Vercel > Team/Account Settings > ID.  (Também aparece em
#                      .vercel/project.json depois de rodar `vercel link` local.)
#   VERCEL_PROJECT_ID  Vercel > Project > Settings > General > Project ID.
#
# NÃO cadastre VITE_API_URL aqui. `vercel pull` baixa as variáveis do próprio
# projeto na Vercel, que é onde elas devem viver — inclusive porque `VITE_*` é
# embutida no bundle e vira pública no navegador.

name: Deploy Vercel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name }}-${{ github.ref }}
  # Preview pode ser cancelado à vontade (é URL descartável). Produção, não: cancelar
  # um deploy de produção no meio deixa o estado indefinido.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Versão fixa da CLI. `vercel@latest` mudaria o comportamento do build sem nenhum
  # commit seu — é dependência mutável no caminho de produção.
  VERCEL_CLI_VERSION: '58.9.0'

jobs:
  gate:
    uses: ./.github/workflows/tests.yml

  preview:
    name: Preview (PR)
    if: github.event_name == 'pull_request'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # só este job escreve, e só para comentar a URL no PR
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Conferir secrets da Vercel
        # Falha cedo e com mensagem clara. Sem isto, a CLI erra com "Error: No existing
        # credentials found", que não diz qual dos três está faltando.
        # Testa se está vazio SEM imprimir o valor.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          faltando=""
          [ -n "${VERCEL_TOKEN:-}" ]      || faltando="$faltando VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID:-}" ]     || faltando="$faltando VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID:-}" ] || faltando="$faltando VERCEL_PROJECT_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes em Settings > Secrets and variables > Actions:$faltando"
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}"

      - name: Baixar config de preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy (prebuilt)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # `--prebuilt` sobe o diretório .vercel/output gerado no passo anterior, em vez
        # de mandar o código-fonte para a Vercel rebuildar. O artefato publicado é
        # exatamente o que este run produziu.
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar a URL no PR
        # Usa o `gh`, que já vem instalado no runner — uma action de terceiro a menos
        # para pinar e auditar. Os valores entram por `env` e são lidos como variável
        # de shell: nunca interpole `${{ ... }}` dentro do corpo de um `run:`, porque
        # dado vindo do evento (título de PR, nome de branch) seria concatenado no
        # script e executado.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # evita depender do remote do git
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          corpo="Preview deste PR: ${PREVIEW_URL}"
          # `--edit-last` atualiza o comentário anterior em vez de empilhar um novo a
          # cada push; no primeiro push não existe comentário, daí o fallback.
          gh pr comment "$PR_NUMBER" --edit-last --body "$corpo" \
            || gh pr comment "$PR_NUMBER" --body "$corpo"

  production:
    name: Produção (main)
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Conferir secrets da Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          faltando=""
          [ -n "${VERCEL_TOKEN:-}" ]      || faltando="$faltando VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID:-}" ]     || faltando="$faltando VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID:-}" ] || faltando="$faltando VERCEL_PROJECT_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes em Settings > Secrets and variables > Actions:$faltando"
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION}"

      - name: Baixar config de produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de produção
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy de produção (prebuilt)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Frontend em produção"
            echo ""
            echo "- Deploy: $url"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "### Rollback"
            echo "Vercel > Project > Deployments > escolha o deploy anterior > **Promote to Production**."
            echo "É troca de alias, não rebuild: leva segundos e não depende deste pipeline."
          } >> "$GITHUB_STEP_SUMMARY"
