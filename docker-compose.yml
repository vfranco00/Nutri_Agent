services:
  # Serviço do Banco de Dados
  db:
    image: postgres:16-alpine
    container_name: nutri_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nosso Backend FastAPI
  api:
    build: ./backend
    container_name: nutri_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Aponta para o serviço `db` acima, NÃO para o DATABASE_URL do .env.
      #
      # Antes esta linha era `DATABASE_URL: ${DATABASE_URL}`, que herdava o valor do
      # .env — e lá ele aponta para o Supabase de PRODUÇÃO. O container local subia o
      # Postgres do compose, esperava ele ficar healthy por causa do `depends_on`, e
      # depois o ignorava: todo desenvolvimento no container lia e escrevia em produção.
      # Criar usuário de teste, apagar receita, depurar um POST — tudo em cima dos dados
      # reais, com a aparência de ambiente isolado.
      #
      # `db` é o nome do serviço na rede do compose, e a porta é a interna (5432), não a
      # publicada.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # Nosso Frontend React
  web:
    build: ./frontend
    container_name: nutri_web
    restart: always
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data: